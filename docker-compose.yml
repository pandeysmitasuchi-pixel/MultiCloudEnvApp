version: '3.8'

services:
  backend-dev:
    build: ./backend/dev
    container_name: multienv-backend-dev
    ports:
      - "3001:3001"
    env_file:
      - ./backend/dev/.env
    restart: unless-stopped

  backend-prod:
    build: ./backend/prod
    container_name: multienv-backend-prod
    ports:
      - "3002:3002"
    env_file:
      - ./backend/prod/.env
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: multienv-frontend
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    depends_on:
      - backend-dev
      - backend-prod
    restart: unless-stopped
